{% load static %}
<style>
    .navbar-logo {
        height: 36px;
        width: auto;
        margin-right: 12px;
    }

    /* New top bar style */
    .topbar {
        background-color: #000;   /* black background */
        color: #fff;              /* white text */
        font-size: 12px;          /* slightly smaller text */
        padding: 3px 12px;        /* slim height + left padding */
        text-align: left;         /* align text to the left */
    }
</style>

<!-- Top bar -->
<div class="topbar">
    &copy; Abbosjon Vositov {% now "Y" %}
</div>


<!-- Existing navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white flex-row border-bottom shadow">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center mx-lg-1 mr-0"
           href="{% url 'landing_page' %}">
            <img
                    src="{% static 'assets/images/logo.svg' %}"
                    alt="Narxlar va Hududlar"
                    class="navbar-logo me-3"
            >
            <span class="h5 mb-0">Narx tahlili</span>
        </a>

        <button class="navbar-toggler mt-2 mr-auto toggle-sidebar text-muted">
            <i class="fe fe-menu navbar-toggler-icon"></i>
        </button>
        <div class="navbar-slide bg-white ml-lg-4" id="navbarSupportedContent">
            <a href="#" class="btn toggle-sidebar d-lg-none text-muted ml-2 mt-3" data-toggle="toggle">
                <i class="fe fe-x"><span class="sr-only"></span></i>
            </a>
            <ul class="navbar-nav mr-auto">
            </ul>
        </div>

        <ul class="navbar-nav d-flex flex-row">
            <li class="nav-item dropdown ml-lg-0">
                <a class="nav-link dropdown-toggle text-muted" href="#" id="navbarDropdownMenuLink" role="button"
                   data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <span class="avatar avatar-sm mt-2">
                    {% if user.userprofile.profile_picture %}
                        <img src="{{ user.userprofile.profile_picture.url }}"
                             alt="{{ user.username }}"
                             class="avatar-img rounded-circle">
                    {% else %}
                        <img src="{% static 'assets/avatars/face-1.jpg' %}"
                             alt="Default Avatar"
                             class="avatar-img rounded-circle">
                    {% endif %}
                </span>
                </a>
                <ul class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdownMenuLink">
                    <li class="nav-item">
                        <a class="nav-link pl-3" href="{% url 'profile_page' %}">Shaxsiy kabinet</a>
                    </li>
                    <li class="nav-item">
                        <form method="post" action="{% url 'logout' %}" id="logout-form">
                            {% csrf_token %}
                            <a href="#" class="nav-link pl-3"
                               onclick="document.getElementById('logout-form').submit(); return false;">
                                Chiqish
                            </a>
                        </form>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<div id="navbarWrapper" class="transition-wrapper">
    <nav class="navbar navbar-expand-lg navbar-light bg-white flex-row border-bottom shadow">
        <div class="container-fluid">
            <!-- your existing navbar content -->
        </div>
    </nav>
</div>
